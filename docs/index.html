<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Check Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --panel:#ffffff; --panel2:#f7f8fc; --border:#e2e6f2; --border2:#c8cfe6;
  --text:#0f1730; --dim:#5c6685; --dim2:#94a0c0;
  --pass:#0e9f6a; --pass-bg:#e7faf1; --pass-br:#b7f0d5; --pass-glow:rgba(14,159,106,.30);
  --run:#c2740a; --run-bg:#fff6e8; --run-br:#f7d9a3; --run-glow:rgba(194,116,10,.30);
  --fail:#d3324a; --fail-bg:#fff0f2; --fail-br:#f8c3cd; --fail-glow:rgba(211,50,74,.30);
  --queue:#8891ab; --queue-bg:#eef0f7;
  --accent:#0891b2; --accent-bg:#e6f8fb; --accent-br:#a8e6f2; --accent-ink:#ffffff; --accent-glow:rgba(8,145,178,.30);
  --sub:#7c5cf0; --sub-bg:#f1ecff; --sub-br:#d7c9fb; --sub-glow:rgba(124,92,240,.30);
  --track:#e9ecf6;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 2px 10px rgba(15,23,42,.05);
  --shadow2:0 10px 30px rgba(15,23,42,.10);
  --ring:0 0 0 3px rgba(8,145,178,.18);
  --r:16px; --nebula:none; --blur:none; --glass:var(--panel);
}
:root[data-theme="dark"]{
  --bg:#05070e; --panel:rgba(16,20,34,.60); --panel2:rgba(21,26,44,.72); --border:rgba(148,163,255,.14); --border2:rgba(148,163,255,.32);
  --text:#edf1ff; --dim:#93a0c8; --dim2:#57628f;
  --pass:#2be8a4; --pass-bg:rgba(43,232,164,.10); --pass-br:rgba(43,232,164,.32); --pass-glow:rgba(43,232,164,.55);
  --run:#ffb545; --run-bg:rgba(255,181,69,.10); --run-br:rgba(255,181,69,.32); --run-glow:rgba(255,181,69,.55);
  --fail:#ff5577; --fail-bg:rgba(255,85,119,.10); --fail-br:rgba(255,85,119,.32); --fail-glow:rgba(255,85,119,.55);
  --queue:#5c6890; --queue-bg:rgba(92,104,144,.16);
  --accent:#22d3ee; --accent-bg:rgba(34,211,238,.10); --accent-br:rgba(34,211,238,.34); --accent-ink:#03141b; --accent-glow:rgba(34,211,238,.55);
  --sub:#a78bfa; --sub-bg:rgba(167,139,250,.12); --sub-br:rgba(167,139,250,.34); --sub-glow:rgba(167,139,250,.55);
  --track:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.4);
  --shadow2:0 14px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(148,163,255,.05);
  --ring:0 0 0 3px rgba(34,211,238,.30);
  --r:16px; --blur:blur(20px) saturate(160%); --glass:var(--panel);
  --nebula:
    radial-gradient(ellipse 1100px 750px at 12% -12%, rgba(124,108,255,.20), transparent 55%),
    radial-gradient(ellipse 900px 650px at 105% 8%, rgba(34,211,238,.14), transparent 55%),
    radial-gradient(ellipse 700px 550px at 45% 115%, rgba(255,85,119,.08), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0px, rgba(255,255,255,.028) 1px, transparent 1px, transparent 44px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0px, rgba(255,255,255,.028) 1px, transparent 1px, transparent 44px);
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:var(--nebula);background-attachment:fixed;background-size:cover;color:var(--text);font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1400px;margin:0 auto;padding:22px 24px 64px;position:relative}
@media (max-width:640px){.wrap{padding:14px 14px 48px}}

/* corner HUD brackets on framed surfaces */
.hud{position:relative}
.hud::before,.hud::after{content:"";position:absolute;width:11px;height:11px;pointer-events:none;opacity:.5;z-index:2}
.hud::before{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);border-radius:3px 0 0 0}
.hud::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);border-radius:0 0 3px 0}
:root:not([data-theme="dark"]) .hud::before,:root:not([data-theme="dark"]) .hud::after{display:none}

/* ============ header ============ */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(34,211,238,.30),transparent 65%),var(--panel2);border:1px solid var(--accent-br);display:grid;place-items:center;flex-shrink:0;position:relative;overflow:hidden;box-shadow:0 0 22px var(--accent-glow),inset 0 0 14px rgba(34,211,238,.10)}
.mark::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0deg,var(--accent-glow) 20deg,transparent 75deg);animation:sweep 3.2s linear infinite}
.mark::after{content:"";position:absolute;inset:5px;border:1px dashed var(--accent-br);border-radius:50%;opacity:.6}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--pass);box-shadow:0 0 8px var(--pass-glow),0 0 18px var(--pass-glow);position:relative;z-index:1;animation:ping 2s ease-out infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--pass-glow),0 0 8px var(--pass-glow)}100%{box-shadow:0 0 0 10px rgba(0,0,0,0),0 0 8px var(--pass-glow)}}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.2}
:root[data-theme="dark"] h1{background:linear-gradient(90deg,#eef1ff 20%,var(--accent) 65%,var(--sub) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.subline{font-size:11.5px;color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.subline b{font-weight:600;color:var(--text);text-transform:none;letter-spacing:0}
.subline span+span::before{content:"·";margin:0 7px;color:var(--dim2)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:500;color:var(--dim);display:inline-flex;align-items:center;gap:7px;transition:all .15s;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{color:var(--text);border-color:var(--border2);box-shadow:var(--shadow),0 0 16px var(--accent-glow)}
.btn.on{color:var(--accent);border-color:var(--accent-br);background:var(--accent-bg);box-shadow:0 0 14px var(--accent-glow)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.9}
kbd{font-size:10px;font-weight:500;color:var(--dim2);border:1px solid var(--border);border-radius:5px;padding:0 5px;line-height:16px;background:var(--panel2)}
.btn.on kbd{color:var(--accent);border-color:var(--accent-br);background:transparent}
.live{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:500;color:var(--dim);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);padding:7px 11px;border-radius:9px;box-shadow:var(--shadow)}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--pass);box-shadow:0 0 8px var(--pass-glow);animation:ping 2s ease-out infinite}
.live.stale .dot{background:var(--run);box-shadow:0 0 8px var(--run-glow);animation:none}
.live.dead .dot{background:var(--fail);box-shadow:0 0 8px var(--fail-glow);animation:none}
.live .ring{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,0%),var(--track) 0);position:relative;flex-shrink:0;filter:drop-shadow(0 0 4px var(--accent-glow))}
.live .ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--panel2)}
.btn.voice-on{color:var(--pass);border-color:var(--pass-br);background:var(--pass-bg);box-shadow:0 0 14px var(--pass-glow)}
.voicedot{width:6px;height:6px;border-radius:50%;background:var(--pass);box-shadow:0 0 6px var(--pass-glow);display:none;flex-shrink:0}
.voicedot.speaking{display:inline-block;animation:pulse 1s ease-in-out infinite}
.btn.alarm-on{color:var(--fail);border-color:var(--fail-br);background:var(--fail-bg);box-shadow:0 0 14px var(--fail-glow)}
.alarmdot{width:6px;height:6px;border-radius:50%;background:var(--fail);box-shadow:0 0 6px var(--fail-glow);display:none;flex-shrink:0}
.alarmdot.ringing{display:inline-block;animation:pulse .5s ease-in-out infinite}

/* ============ stats ============ */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px 14px;cursor:pointer;position:relative;transition:all .18s;box-shadow:var(--shadow);min-width:0}
.stat:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow2)}
.stat.on{border-color:var(--accent);box-shadow:var(--ring),0 0 20px var(--accent-glow)}
.stat .l{font-size:10.5px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.06em}
.stat .l i{width:7px;height:7px;border-radius:50%;background:var(--dim2);flex-shrink:0}
.stat.pass .l i{background:var(--pass);box-shadow:0 0 6px var(--pass-glow)} .stat.run .l i{background:var(--run);box-shadow:0 0 6px var(--run-glow)} .stat.fail .l i{background:var(--fail);box-shadow:0 0 6px var(--fail-glow)} .stat.sub .l i{background:var(--sub);box-shadow:0 0 6px var(--sub-glow)} .stat.rate .l i{background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
.stat .n{font-size:31px;font-weight:700;line-height:1.05;letter-spacing:-.02em;margin-top:8px}
.stat.pass .n{color:var(--pass);text-shadow:0 0 22px var(--pass-glow)} .stat.run .n{color:var(--run);text-shadow:0 0 22px var(--run-glow)} .stat.fail .n{color:var(--fail);text-shadow:0 0 22px var(--fail-glow)} .stat.sub .n{color:var(--sub);text-shadow:0 0 22px var(--sub-glow)} .stat.rate .n{color:var(--accent);text-shadow:0 0 22px var(--accent-glow)}
.stat .s{font-size:11.5px;color:var(--dim2);margin-top:5px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .bar{height:4px;border-radius:3px;background:var(--track);margin-top:12px;overflow:hidden}
.stat .bar i{display:block;height:100%;width:var(--w,0%);background:var(--dim2);transition:width .5s;border-radius:3px}
.stat.pass .bar i{background:var(--pass);box-shadow:0 0 8px var(--pass-glow)} .stat.run .bar i{background:var(--run);box-shadow:0 0 8px var(--run-glow)} .stat.fail .bar i{background:var(--fail);box-shadow:0 0 8px var(--fail-glow)} .stat.sub .bar i{background:var(--sub);box-shadow:0 0 8px var(--sub-glow)} .stat.rate .bar i{background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}

/* ============ toolbar ============ */
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:16px;position:sticky;top:10px;z-index:5;box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:0 10px;flex:1 1 220px;min-width:180px;height:34px;transition:.15s}
.search:focus-within{border-color:var(--accent-br);box-shadow:var(--ring);background:var(--panel)}
.search input{background:transparent;border:0;outline:0;box-shadow:none;font-size:12.5px;width:100%;height:100%}
.search input::placeholder{color:var(--dim2)}
.search .k{font-size:10px;color:var(--dim2);border:1px solid var(--border);border-radius:5px;padding:0 5px;line-height:16px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;height:34px}
.seg button{border:0;background:transparent;padding:0 10px;border-radius:7px;font-size:12px;font-weight:500;color:var(--dim);display:inline-flex;align-items:center;gap:7px;transition:all .12s;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.seg button .c{font-size:10.5px;font-weight:500;color:var(--dim2);background:var(--track);padding:0 6px;border-radius:5px;line-height:17px}
.seg button.on .c{color:inherit}
.seg button.on.pass{color:var(--pass);box-shadow:inset 0 0 0 1px var(--pass-br)} .seg button.on.run{color:var(--run);box-shadow:inset 0 0 0 1px var(--run-br)} .seg button.on.fail{color:var(--fail);box-shadow:inset 0 0 0 1px var(--fail-br)} .seg button.on.sub{color:var(--sub);box-shadow:inset 0 0 0 1px var(--sub-br)}
.sel{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:0 28px 0 10px;font-size:12px;font-weight:500;outline:0;height:34px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px;background-repeat:no-repeat;max-width:240px;text-overflow:ellipsis}
.sel:hover{border-color:var(--border2)}
.spacer{flex:1}
.fcount{font-size:12px;color:var(--dim);font-weight:500;white-space:nowrap}
.tools .btn{height:34px;box-shadow:none;background:var(--panel2)}
.tools .btn.on{background:var(--accent-bg)}

/* ============ layout ============ */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:78px}
@media (max-width:1100px){.side{position:static}}
.panel{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ph small{font-weight:500;color:var(--dim2);font-size:11px;text-transform:none;letter-spacing:0}
.pb{padding:8px;max-height:360px;overflow:auto}
.pb::-webkit-scrollbar{width:8px}.pb::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
.empty{color:var(--dim2);font-size:12px;padding:16px 10px;text-align:center}

/* attention */
.att{display:flex;flex-direction:column;gap:4px}
.att a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:8px 10px;border-radius:9px;font-size:12.5px;transition:.12s}
.att a:hover{background:var(--panel2)}
.att .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.att .d.fail{background:var(--fail);box-shadow:0 0 7px var(--fail-glow)} .att .d.run{background:var(--run);box-shadow:0 0 7px var(--run-glow);animation:pulse 1.4s infinite}
.att .t{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.att .t small{display:block;color:var(--dim);font-size:11px;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.att .v{font-size:11.5px;color:var(--dim);white-space:nowrap;font-weight:500}
.att a.fail .v{color:var(--fail)} .att a.run .v{color:var(--run)}

/* feed */
.feed{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:8px 10px;border-radius:9px}
.ev:hover{background:var(--panel2)}
.ev .d{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--queue)}
.ev.passed .d{background:var(--pass);box-shadow:0 0 6px var(--pass-glow)} .ev.failing .d{background:var(--fail);box-shadow:0 0 6px var(--fail-glow)} .ev.running .d{background:var(--run);box-shadow:0 0 6px var(--run-glow)} .ev.started .d{background:var(--run);box-shadow:0 0 6px var(--run-glow)} .ev.push .d,.ev.discovered .d,.ev.review .d{background:var(--sub);box-shadow:0 0 6px var(--sub-glow)}
.ev .m{font-size:12.5px;font-weight:500}
.ev .k{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;margin-top:1px}
.ev .k span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .k span:last-child{white-space:nowrap;color:var(--dim2)}

/* durations */
.dur{display:flex;flex-direction:column;gap:6px;padding:4px}
.dur .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:12px;padding:4px 6px}
.dur .r .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dur .r .bar{grid-column:1/3;height:5px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:3px}
.dur .r .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--sub));box-shadow:0 0 8px var(--accent-glow);width:var(--w);border-radius:3px}
.dur .r .v{font-size:11.5px;color:var(--dim);white-space:nowrap}

/* ============ cards ============ */
.list{display:flex;flex-direction:column;gap:12px;min-width:0}
.group{font-size:11.5px;font-weight:700;color:var(--dim);padding:6px 2px 0;display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.08em}
.group::after{content:"";flex:1;height:1px;background:var(--border)}
.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px 16px 21px;transition:all .18s;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--queue)}
.card.passed::before{background:var(--pass);box-shadow:0 0 14px var(--pass-glow)}
.card.running::before{background:var(--run);box-shadow:0 0 14px var(--run-glow)}
.card.failing::before,.card.error::before{background:var(--fail);box-shadow:0 0 14px var(--fail-glow)}
.card:hover{border-color:var(--border2);box-shadow:var(--shadow2);transform:translateY(-1px)}
.card.changed{animation:flash 2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent-br),var(--shadow2),0 0 30px var(--accent-glow)}100%{box-shadow:var(--shadow)}}
.r1{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.l{min-width:0;flex:1}
.repo{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);flex-wrap:wrap;font-weight:500}
.repo .num{color:var(--accent);font-weight:700;text-shadow:0 0 10px var(--accent-glow)}
.repo .lbl{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);color:var(--dim)}
.repo .lbl.draft{color:var(--run);border-color:var(--run-br);background:var(--run-bg)}
.repo .lbl.ok{color:var(--pass);border-color:var(--pass-br);background:var(--pass-bg)}
.repo .lbl.bad{color:var(--fail);border-color:var(--fail-br);background:var(--fail-bg)}
.title{font-size:14.5px;font-weight:600;margin-top:3px;text-decoration:none;display:block;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.title:hover{color:var(--accent)}
.badges{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap;border:1px solid transparent;letter-spacing:.02em}
.badge.passed{color:var(--pass);background:var(--pass-bg);border-color:var(--pass-br);box-shadow:0 0 14px var(--pass-glow)}
.badge.running{color:var(--run);background:var(--run-bg);border-color:var(--run-br);box-shadow:0 0 14px var(--run-glow)}
.badge.failing,.badge.error{color:var(--fail);background:var(--fail-bg);border-color:var(--fail-br);box-shadow:0 0 14px var(--fail-glow)}
.bdot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.bdot.running{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.sub-btn{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px;white-space:nowrap;border:1px solid var(--border);background:transparent;color:var(--dim);transition:all .12s}
.sub-btn:hover{border-color:var(--sub-br);color:var(--sub);background:var(--sub-bg)}
.sub-btn.on{background:var(--sub);border-color:var(--sub);color:#fff;box-shadow:0 0 14px var(--sub-glow)}
.meta{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--dim);font-weight:500}
.meta .add{color:var(--pass)} .meta .del{color:var(--fail)}
.meta .br{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.meta .br code{font-family:inherit;background:var(--panel2);border:1px solid var(--border);padding:1px 8px;border-radius:6px;color:var(--text);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle;font-weight:500}
.meta .arrow{color:var(--dim2)}
.prog{display:flex;align-items:center;gap:12px;margin-top:12px}
.segbar{flex:1;height:8px;border-radius:6px;background:var(--track);overflow:hidden;display:flex;gap:2px}
.segbar i{display:block;height:100%;transition:width .4s}
.segbar .p{background:var(--pass);box-shadow:0 0 10px var(--pass-glow)} .segbar .f{background:var(--fail);box-shadow:0 0 10px var(--fail-glow)} .segbar .r{background:var(--run);box-shadow:0 0 10px var(--run-glow);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 4px,transparent 4px 8px);animation:stripes 1s linear infinite} .segbar .q{background:var(--queue)}
@keyframes stripes{to{background-position:16px 0}}
.pct{font-size:12px;color:var(--dim);white-space:nowrap;font-weight:500}
.pct b{color:var(--text);font-weight:700}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:500;padding:4px 9px 4px 8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--dim);text-decoration:none;transition:all .12s;max-width:100%}
.chk:hover{border-color:var(--border2);color:var(--text);background:var(--panel);box-shadow:0 0 10px var(--accent-glow)}
.chk .d{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--queue)}
.chk.passed .d{background:var(--pass);box-shadow:0 0 5px var(--pass-glow)} .chk.failed .d{background:var(--fail);box-shadow:0 0 5px var(--fail-glow)} .chk.running .d{background:var(--run);box-shadow:0 0 5px var(--run-glow);animation:pulse 1.2s infinite} .chk.skipped .d{background:var(--dim2)}
.chk.failed{color:var(--fail);border-color:var(--fail-br);background:var(--fail-bg)}
.chk.running{color:var(--run);border-color:var(--run-br);background:var(--run-bg)}
.chk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk .t{color:var(--dim2);font-weight:400}
.chk.running .t,.chk.failed .t{color:inherit;opacity:.85}
.card.collapsed .checks{display:none}
.tog{background:transparent;border:0;color:var(--dim2);font-size:11.5px;font-weight:500;padding:0;margin-top:10px}
.tog:hover{color:var(--accent)}

/* ============ table ============ */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap;background:var(--panel2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--panel2)}
.tbl .mini{height:6px;width:110px;border-radius:4px;background:var(--track);overflow:hidden;display:flex;gap:1px}
.tbl .mini i{display:block;height:100%}
.tbl .t{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;text-decoration:none;font-weight:500}
.tbl .t:hover{color:var(--accent)}
.tbl .rp{color:var(--dim);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tblwrap{overflow-x:auto}

.foot{margin-top:28px;text-align:center;color:var(--dim2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--text);border:1px solid var(--accent-br);padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--shadow2),0 0 20px var(--accent-glow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="mark"><i></i></div>
      <div>
        <h1>PR Check Monitor</h1>
        <div class="subline" id="scope">Loading…</div>
      </div>
    </div>
    <div class="actions">
      <div class="live" id="live"><span class="dot"></span><span id="liveText">connecting</span><span class="ring" id="ring" title="next refresh"></span></div>
      <button class="btn" id="btnCopy" title="Copy visible PRs as a markdown table">Copy summary</button>
      <button class="btn" id="btnVoice" title="Read check status changes out loud as they happen"><span class="voicedot" id="voiceDot"></span><span id="voiceLabel">Announcements</span> <kbd>A</kbd></button>
      <button class="btn" id="btnAlarm" title="Tick as checks progress, chime when one passes, alarm when one fails"><span class="alarmdot" id="alarmDot"></span><span id="alarmLabel">Sound alerts</span> <kbd>L</kbd></button>
      <button class="btn" id="btnTheme" title="Toggle theme">Dark <kbd>T</kbd></button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tools hud">
    <div class="search"><input id="q" placeholder="Search repo, title, branch, check, #num" autocomplete="off"><span class="k">/</span></div>
    <div class="seg" id="segStatus">
      <button data-v="all" class="on">All <span class="c" id="cAll">0</span></button>
      <button data-v="failing" class="fail">Failing <span class="c" id="cFail">0</span></button>
      <button data-v="running" class="run">Running <span class="c" id="cRun">0</span></button>
      <button data-v="passed" class="pass">Passed <span class="c" id="cPass">0</span></button>
    </div>
    <div class="seg" id="segSub">
      <button data-v="all" class="on">Any</button>
      <button data-v="yes" class="sub">Submitted</button>
      <button data-v="no">Not submitted</button>
    </div>
    <select class="sel" id="sort">
      <option value="created_desc">Newest first</option>
      <option value="created_asc">Oldest first</option>
      <option value="status">Status: fail → run → pass</option>
      <option value="progress">Least progress</option>
      <option value="furthest">Checks moved farthest</option>
      <option value="changed">Recently changed</option>
      <option value="repo">Repo A → Z</option>
      <option value="size">Largest diff</option>
    </select>
    <select class="sel" id="repoSel"><option value="">All repos</option></select>
    <div class="seg" id="segView">
      <button data-v="cards" class="on">Cards</button>
      <button data-v="table">Table</button>
    </div>
    <button class="btn" id="btnGroup">Group by repo</button>
    <button class="btn" id="btnExpand">Collapse all <kbd>E</kbd></button>
    <span class="spacer"></span>
    <span class="fcount" id="fcount"></span>
    <button class="btn" id="btnReset">Reset</button>
  </div>

  <div class="grid">
    <div class="list" id="list"></div>
    <div class="side">
      <div class="panel hud">
        <div class="ph"><span>Needs attention</span><small id="attCount"></small></div>
        <div class="pb"><div class="att" id="att"></div></div>
      </div>
      <div class="panel hud">
        <div class="ph"><span>Activity</span><small id="feedCount"></small></div>
        <div class="pb"><div class="feed" id="feed"></div></div>
      </div>
      <div class="panel hud">
        <div class="ph"><span>Slowest checks</span><small>avg of completed runs</small></div>
        <div class="pb"><div class="dur" id="dur"></div></div>
      </div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= state ================= */
let DATA = [], EVENTS = [], SNAP = null, CFG = {}, lastFetch = 0, prevOverall = {};
const REFRESH_MS = 3000;
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const F = Object.assign({ q:"", status:"all", sub:"all", sort:"created_desc", repo:"", group:false, view:"cards", collapsed:{} }, LS.get("prmon_filters", {}));
let THEME = LS.get("prmon_theme2", null) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
let allCollapsed = false;
let VOICE = LS.get("prmon_voice", false);
let voiceWatermark = LS.get("prmon_voice_watermark", null);
let ALARM = LS.get("prmon_alarm", false);
let alarmWatermark = LS.get("prmon_alarm_watermark", null);

/* ================= utils ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtDur(sec){
  if(sec == null) return "";
  sec = Math.max(0, Math.floor(sec));
  if(sec < 60) return sec + "s";
  const m = Math.floor(sec/60), s = sec%60;
  if(m < 60) return m + "m " + (s<10?"0":"") + s + "s";
  const h = Math.floor(m/60), mm = m%60;
  return h + "h " + (mm<10?"0":"") + mm + "m";
}
function ago(ts){ if(!ts) return ""; return fmtDur((Date.now() - new Date(ts).getTime())/1000) + " ago"; }
function key(pr){ return pr.repo + "#" + pr.num; }
function getMarks(){ return LS.get("pr_submitted_marks", {}); }
function isSub(pr){ return !!pr.submitted || !!getMarks()[key(pr)]; }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }

/* ================= voice announcements ================= */
function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.05;
  speechSynthesis.speak(u);
}
function phraseFor(e){
  const m = e.pr.match(/#(\d+)$/); const num = m ? m[1] : "";
  const repo = e.pr.replace(/#\d+$/, "").replace(/^dynamo-[0-9a-f]{6,8}-/, "").replace(/-/g, " ");
  const prefix = `PR ${num} in ${repo}`;
  if(e.type === "discovered") return `${prefix}: new pull request discovered.`;
  return `${prefix}: ${e.msg.replace(/→/g, "to")}.`;
}
function announceNewEvents(){
  if(!VOICE || voiceWatermark == null || !EVENTS.length) return;
  const fresh = EVENTS.filter(e => new Date(e.ts).getTime() > voiceWatermark);
  if(!fresh.length) return;
  if(fresh.length > 12){
    const prs = new Set(fresh.map(e=>e.pr));
    speak(`${fresh.length} updates across ${prs.size} pull requests. Check the activity panel for details.`);
  } else {
    fresh.forEach(e=>speak(phraseFor(e)));
  }
  voiceWatermark = Math.max(...fresh.map(e=>new Date(e.ts).getTime()));
  LS.set("prmon_voice_watermark", voiceWatermark);
}
function setVoice(on){
  VOICE = on; LS.set("prmon_voice", VOICE);
  if(VOICE){
    voiceWatermark = Date.now();
    LS.set("prmon_voice_watermark", voiceWatermark);
    speak("Voice announcements on. I'll call out check status changes as they happen.");
  } else {
    speechSynthesis.cancel();
  }
  syncControls();
}

/* ================= alarm sound ================= */
let alarmCtx = null;
function ensureAudioCtx(){
  if(!alarmCtx) alarmCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(alarmCtx.state === "suspended") alarmCtx.resume().catch(()=>{});
  return alarmCtx;
}
// Browsers only let audio actually play after a real user gesture in THIS
// page load. The "Sound alerts" toggle state persists in localStorage, so on
// a reload it can read as "on" with no fresh click to unlock audio — sound
// would then silently fail to play with no visible error. Unlock on the
// very first interaction anywhere on the page, not just the toggle itself.
["click", "keydown", "touchstart"].forEach(evt =>
  document.addEventListener(evt, () => { try{ ensureAudioCtx(); }catch(e){} }, {once:true})
);
function playTick(count){
  try{
    const ctx = ensureAudioCtx();
    const now = ctx.currentTime;
    const n = Math.min(count || 1, 6);
    for(let i=0;i<n;i++){
      const t0 = now + i*0.18;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1200, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.4, t0+0.01);
      gain.gain.linearRampToValueAtTime(0, t0+0.09);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.1);
    }
    flashAlarmDot(n*180 + 300);
  }catch(e){}
}
function playAlarm(durationSec){
  try{
    const ctx = ensureAudioCtx();
    const now = ctx.currentTime;
    const stepDur = 0.3;
    const steps = Math.max(1, Math.round((durationSec ?? 10) / stepDur));
    for(let i=0;i<steps;i++){
      const t0 = now + i*stepDur;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(i%2 ? 740 : 990, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.7, t0+0.015);
      gain.gain.setValueAtTime(0.7, t0+0.16);
      gain.gain.linearRampToValueAtTime(0, t0+0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.22);
    }
    flashAlarmDot(steps*stepDur*1000 + 300);
  }catch(e){}
}
function playChime(durationSec){
  try{
    const ctx = ensureAudioCtx();
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5 — bright ascending triad
    const noteGap = 0.13, tail = 0.15;
    const patternDur = notes.length*noteGap + tail;
    const reps = Math.max(1, Math.round((durationSec ?? 10) / patternDur));
    for(let r=0;r<reps;r++){
      const base = now + r*patternDur;
      notes.forEach((freq,i)=>{
        const t0 = base + i*noteGap;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.6, t0+0.02);
        gain.gain.setValueAtTime(0.6, t0+0.1);
        gain.gain.linearRampToValueAtTime(0, t0+0.14);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0); osc.stop(t0+0.16);
      });
    }
    flashAlarmDot(reps*patternDur*1000 + 300);
  }catch(e){}
}
function flashAlarmDot(ms){
  const dot = $("alarmDot");
  dot.classList.add("ringing");
  clearTimeout(dot._h);
  dot._h = setTimeout(()=>dot.classList.remove("ringing"), ms);
}
function checkAlarm(){
  if(!ALARM || alarmWatermark == null || !EVENTS.length) return;
  const fresh = EVENTS.filter(e => new Date(e.ts).getTime() > alarmWatermark);
  if(!fresh.length) return;
  const startedCount = fresh.filter(e => e.type === "started").length;
  const hasFail = fresh.some(e => e.type === "failing" || e.type === "error");
  const hasPass = fresh.some(e => e.type === "passed");
  let delay = 0;
  if(startedCount){ playTick(startedCount); delay += Math.min(startedCount,6)*180 + 300; }
  if(hasPass){ setTimeout(()=>playChime(10), delay); delay += 10500; }
  if(hasFail){ setTimeout(()=>playAlarm(10), delay); }
  alarmWatermark = Math.max(...fresh.map(e=>new Date(e.ts).getTime()));
  LS.set("prmon_alarm_watermark", alarmWatermark);
}
function setAlarm(on){
  ALARM = on; LS.set("prmon_alarm", ALARM);
  if(ALARM){
    // Start from now, not whatever was last saved — otherwise reopening the
    // tab after a while replays a backlog of old events all at once.
    alarmWatermark = Date.now();
    LS.set("prmon_alarm_watermark", alarmWatermark);
    playTick(2);
    setTimeout(()=>playChime(1.5), 700);
    setTimeout(()=>playAlarm(1.5), 2500);
  }
  syncControls();
}

/* ================= filtering ================= */
function visible(){
  const marks = getMarks();
  const q = F.q.trim().toLowerCase();
  let rows = DATA.filter(pr => {
    if(F.status === "failing" && !(pr.overall === "failing" || pr.overall === "error")) return false;
    if(F.status === "running" && pr.overall !== "running") return false;
    if(F.status === "passed" && pr.overall !== "passed") return false;
    const sub = !!pr.submitted || !!marks[key(pr)];
    if(F.sub === "yes" && !sub) return false;
    if(F.sub === "no" && sub) return false;
    if(F.repo && pr.repo !== F.repo) return false;
    if(q){
      const hay = [pr.repo, pr.title, pr.head, "#"+pr.num, ...(pr.labels||[]), ...(pr.checks||[]).map(c=>c.name)].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const rank = {failing:0, error:0, running:1, passed:2};
  const sorters = {
    created_desc:(a,b)=> (b.createdAt||"").localeCompare(a.createdAt||""),
    created_asc:(a,b)=> (a.createdAt||"").localeCompare(b.createdAt||""),
    status:(a,b)=> (rank[a.overall]-rank[b.overall]) || (b.createdAt||"").localeCompare(a.createdAt||""),
    progress:(a,b)=> ((a.total?a.passed/a.total:0) - (b.total?b.passed/b.total:0)),
    // "Farthest along" = most checks no longer queued/running (passed, failed
    // or skipped all count as "moved") — not the same as passed-only progress,
    // since a PR deep into its pipeline with one failure is still further
    // along than one that's barely started.
    furthest:(a,b)=> {
      const doneA = a.total ? (a.total-(a.running||[]).length-(a.queued||[]).length)/a.total : 0;
      const doneB = b.total ? (b.total-(b.running||[]).length-(b.queued||[]).length)/b.total : 0;
      return doneB - doneA || (b.total||0) - (a.total||0);
    },
    changed:(a,b)=> (b.last_change||"").localeCompare(a.last_change||""),
    repo:(a,b)=> a.repo.localeCompare(b.repo) || (+a.num - +b.num),
    size:(a,b)=> ((b.additions||0)+(b.deletions||0)) - ((a.additions||0)+(a.deletions||0)),
  };
  rows.sort(sorters[F.sort] || sorters.created_desc);
  return rows;
}

/* ================= render: stats ================= */
function renderStats(){
  let pass=0, run=0, fail=0, sub=0, cp=0, ct=0, cr=0, cf=0;
  const runningByCheck = {}; // check name -> count of PRs currently running it
  DATA.forEach(pr=>{
    if(pr.overall==="passed") pass++; else if(pr.overall==="failing"||pr.overall==="error") fail++; else run++;
    if(isSub(pr)) sub++;
    cp += pr.passed||0; ct += pr.total||0; cr += (pr.running||[]).length + (pr.queued||[]).length; cf += (pr.failed||[]).length;
    const seenOnThisPr = new Set();
    (pr.running||[]).forEach(r=>{
      if(seenOnThisPr.has(r.name)) return; // one PR only counts once per check name
      seenOnThisPr.add(r.name);
      runningByCheck[r.name] = (runningByCheck[r.name]||0) + 1;
    });
  });
  const n = DATA.length || 1;
  const rate = ct ? Math.round(cp/ct*100) : 0;
  // One card per distinct check name currently in flight, e.g. 2 PRs on
  // "pass2" + 1 on "tier1" -> two cards, "pass2: 2" and "tier1: 1". Updates
  // every poll — cards appear/disappear as checks start/finish.
  const checkCards = Object.entries(runningByCheck)
    .sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]))
    .map(([name,count])=>({
      cls:"run", v:count, l:name, s:`PR${count===1?"":"s"} running ${name}`,
      w:count/n*100, f:{q:name},
    }));
  const cards = [
    {cls:"", v:DATA.length, l:"Open PRs", s:`last ${CFG.window_hours||24}h`, w:100, f:{status:"all"}},
    {cls:"fail", v:fail, l:"Failing", s:`${cf} failed check${cf===1?"":"s"}`, w:fail/n*100, f:{status:"failing"}},
    {cls:"run", v:run, l:"Running", s:`${cr} check${cr===1?"":"s"} in flight`, w:run/n*100, f:{status:"running"}},
    {cls:"pass", v:pass, l:"All green", s:`${Math.round(pass/n*100)}% of PRs`, w:pass/n*100, f:{status:"passed"}},
    {cls:"sub", v:sub, l:"Submitted", s:`${DATA.length-sub} remaining`, w:sub/n*100, f:{sub:"yes"}},
    {cls:"rate", v:rate+"%", l:"Check pass rate", s:`${cp} of ${ct} checks`, w:rate, f:null},
    ...checkCards,
  ];
  $("stats").innerHTML = cards.map((c,i)=>{
    const on = c.f && ((c.f.status && c.f.status!=="all" && F.status===c.f.status) || (c.f.sub && F.sub==="yes") || (c.f.q && F.q===c.f.q));
    return `<div class="stat ${c.cls} ${on?'on':''}" data-i="${i}" role="button" tabindex="0"><div class="l"><i></i>${esc(c.l)}</div><div class="n num">${c.v}</div><div class="s">${esc(c.s)}</div><div class="bar"><i style="--w:${c.w}%"></i></div></div>`;
  }).join("");
  $("stats").querySelectorAll(".stat").forEach(el=>el.addEventListener("click",()=>{
    const c = cards[+el.dataset.i]; if(!c.f) return;
    if(c.f.status){ F.status = (F.status===c.f.status && c.f.status!=="all") ? "all" : c.f.status; }
    if(c.f.sub){ F.sub = F.sub==="yes" ? "all" : "yes"; }
    if(c.f.q){ F.q = (F.q===c.f.q) ? "" : c.f.q; }
    save(); render();
  }));
  $("cAll").textContent = DATA.length; $("cFail").textContent = fail; $("cRun").textContent = run; $("cPass").textContent = pass;
}

/* ================= render: card ================= */
function segbar(pr){
  const t = pr.total || 1;
  const f=(pr.failed||[]).length, r=(pr.running||[]).length, q=(pr.queued||[]).length, p=pr.passed||0;
  return `<div class="segbar"><i class="p" style="width:${p/t*100}%"></i><i class="f" style="width:${f/t*100}%"></i><i class="r" style="width:${r/t*100}%"></i><i class="q" style="width:${q/t*100}%"></i></div>`;
}
function card(pr, now){
  const k = key(pr);
  const sub = isSub(pr);
  const label = pr.overall==="passed"?"All passed":pr.overall==="failing"?"Failing":pr.overall==="error"?"Error":"Running";
  const rd = pr.reviewDecision || "";
  const tags = [];
  if(pr.draft) tags.push(`<span class="lbl draft">Draft</span>`);
  if(rd==="APPROVED") tags.push(`<span class="lbl ok">Approved</span>`);
  if(rd==="CHANGES_REQUESTED") tags.push(`<span class="lbl bad">Changes requested</span>`);
  if(rd==="REVIEW_REQUIRED") tags.push(`<span class="lbl">Review required</span>`);
  if(pr.mergeable==="CONFLICTING") tags.push(`<span class="lbl bad">Conflicts</span>`);
  (pr.labels||[]).forEach(l=>tags.push(`<span class="lbl">${esc(l)}</span>`));

  const checks = (pr.checks||[]).map(c=>{
    let t = "";
    if(c.state==="running" && c.started_at) t = fmtDur((now - new Date(c.started_at).getTime())/1000);
    else if(c.duration_sec!=null) t = fmtDur(c.duration_sec);
    else if(c.state==="queued") t = "queued";
    return `<a class="chk ${c.state}" href="${esc(c.url||pr.url)}" target="_blank" rel="noopener" title="${esc(c.name)} · ${c.state}${c.conclusion?' · '+c.conclusion:''}"><span class="d"></span><span class="nm">${esc(c.name)}</span>${t?`<span class="t">${t}</span>`:""}</a>`;
  }).join("");

  const collapsed = F.collapsed[k] ?? allCollapsed;
  const changed = prevOverall[k] && prevOverall[k] !== pr.overall;
  return `<div class="card ${pr.overall} ${collapsed?'collapsed':''} ${changed?'changed':''}" data-k="${esc(k)}">
    <div class="r1">
      <div class="l">
        <div class="repo"><span class="num">#${pr.num}</span><span>${esc(pr.repo)}</span>${tags.join("")}</div>
        <a class="title" href="${esc(pr.url)}" target="_blank" rel="noopener" title="${esc(pr.title)}">${esc(pr.title)}</a>
      </div>
      <div class="badges">
        <span class="badge ${pr.overall}"><span class="bdot ${pr.overall==='running'?'running':''}"></span>${label}</span>
        <button class="sub-btn ${sub?'on':''}" data-sub="${esc(k)}" title="${sub?'Unmark':'Mark as submitted'}">${sub?'Submitted':'Mark submitted'}</button>
      </div>
    </div>
    <div class="meta">
      ${pr.head?`<span class="br"><code title="${esc(pr.head)}">${esc(pr.head)}</code><span class="arrow">→</span><code>${esc(pr.base||"main")}</code></span>`:""}
      <span><span class="add">+${pr.additions??0}</span> <span class="del">−${pr.deletions??0}</span> · ${pr.changedFiles??0} files</span>
      <span title="${esc(pr.createdAt||"")}">Opened ${ago(pr.createdAt)}</span>
      ${pr.last_change?`<span title="last status change">Changed ${ago(pr.last_change)}</span>`:""}
    </div>
    <div class="prog">${segbar(pr)}<span class="pct"><b>${pr.passed}</b> / ${pr.total}${(pr.failed||[]).length?` · <span style="color:var(--fail)">${(pr.failed||[]).length} failed</span>`:""}${(pr.running||[]).length?` · <span style="color:var(--run)">${(pr.running||[]).length} running</span>`:""}${(pr.queued||[]).length?` · ${(pr.queued||[]).length} queued`:""}</span></div>
    <div class="checks">${checks || `<span class="empty">No checks reported yet</span>`}</div>
    <button class="tog" data-tog="${esc(k)}">${collapsed?`Show ${pr.total} checks`:"Hide checks"}</button>
  </div>`;
}

/* ================= render: table ================= */
function table(rows, now){
  const tr = rows.map(pr=>{
    const t = pr.total||1, f=(pr.failed||[]).length, r=(pr.running||[]).length, q=(pr.queued||[]).length, p=pr.passed||0;
    const runTxt = (pr.running||[]).map(x=>`${esc(x.name)} ${fmtDur((now-new Date(x.started_at).getTime())/1000)}`).join(", ");
    const label = pr.overall==="passed"?"Passed":pr.overall==="failing"?"Failing":pr.overall==="error"?"Error":"Running";
    return `<tr>
      <td><div class="rp" title="${esc(pr.repo)}">${esc(pr.repo)}</div></td>
      <td style="color:var(--accent);font-weight:600">#${pr.num}</td>
      <td><a class="t" href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(pr.title)}</a></td>
      <td><span class="badge ${pr.overall}"><span class="bdot ${pr.overall==='running'?'running':''}"></span>${label}</span></td>
      <td><div style="display:flex;align-items:center;gap:10px"><div class="mini"><i style="width:${p/t*100}%;background:var(--pass)"></i><i style="width:${f/t*100}%;background:var(--fail)"></i><i style="width:${r/t*100}%;background:var(--run)"></i><i style="width:${q/t*100}%;background:var(--queue)"></i></div><span style="font-size:12px;color:var(--dim);font-weight:500">${p}/${pr.total}</span></div></td>
      <td style="color:var(--fail);font-weight:500">${(pr.failed||[]).map(esc).join(", ")||"<span style='color:var(--dim2)'>—</span>"}</td>
      <td style="color:var(--run);font-weight:500">${runTxt||"<span style='color:var(--dim2)'>—</span>"}</td>
      <td style="color:var(--dim)">${ago(pr.createdAt)}</td>
      <td><button class="sub-btn ${isSub(pr)?'on':''}" data-sub="${esc(key(pr))}">${isSub(pr)?'Submitted':'Mark'}</button></td>
    </tr>`;
  }).join("");
  return `<div class="panel tblwrap"><table class="tbl"><thead><tr><th>Repo</th><th>PR</th><th>Title</th><th>Status</th><th>Checks</th><th>Failing</th><th>Running</th><th>Opened</th><th></th></tr></thead><tbody>${tr}</tbody></table></div>`;
}

/* ================= render: side panels ================= */
function renderSide(now){
  const items = [];
  DATA.forEach(pr=>(pr.checks||[]).filter(c=>c.state==="failed").forEach(c=>items.push({k:0,cls:"fail",pr,c,v:"Failed"})));
  DATA.forEach(pr=>(pr.checks||[]).filter(c=>c.state==="running").forEach(c=>items.push({k:1,cls:"run",pr,c,v:c.started_at?fmtDur((now-new Date(c.started_at).getTime())/1000):"Running"})));
  const nf = items.filter(i=>i.k===0).length, nr = items.filter(i=>i.k===1).length;
  $("attCount").textContent = items.length ? `${nf} failed · ${nr} running` : "";
  $("att").innerHTML = items.length ? items.map(i=>`<a class="${i.cls}" href="${esc(i.c.url||i.pr.url)}" target="_blank" rel="noopener"${i.k===1&&i.c.started_at?` data-start="${esc(i.c.started_at)}"`:""}><span class="d ${i.cls}"></span><span class="t">${esc(i.c.name)}<small>#${i.pr.num} · ${esc(i.pr.repo)}</small></span><span class="v">${i.v}</span></a>`).join("") : `<div class="empty">Everything is green</div>`;

  const evs = [...EVENTS].reverse().slice(0,80);
  $("feedCount").textContent = EVENTS.length ? `${EVENTS.length} events` : "";
  $("feed").innerHTML = evs.length ? evs.map(e=>`<div class="ev ${esc(e.type)}"><span class="d"></span><div><div class="m">${esc(e.msg)}</div><div class="k"><span>${esc(e.pr)}</span><span>${ago(e.ts)}</span></div></div></div>`).join("") : `<div class="empty">No state changes recorded yet</div>`;

  const agg = {};
  DATA.forEach(pr=>(pr.checks||[]).forEach(c=>{ if(c.duration_sec!=null && c.state!=="skipped"){ (agg[c.name] ||= []).push(c.duration_sec); } }));
  const rows = Object.entries(agg).map(([n,a])=>({n,avg:a.reduce((x,y)=>x+y,0)/a.length,cnt:a.length})).sort((a,b)=>b.avg-a.avg).slice(0,10);
  const max = rows[0]?.avg || 1;
  $("dur").innerHTML = rows.length ? rows.map(r=>`<div class="r"><span class="nm" title="${esc(r.n)}">${esc(r.n)}</span><span class="v">${fmtDur(r.avg)} · ${r.cnt} run${r.cnt===1?"":"s"}</span><div class="bar"><i style="--w:${r.avg/max*100}%"></i></div></div>`).join("") : `<div class="empty">No completed checks yet</div>`;
}

/* ================= render: main ================= */
function render(){
  const now = Date.now();
  renderStats();
  const rows = visible();
  $("fcount").textContent = `${rows.length} of ${DATA.length}`;
  const list = $("list");
  const none = `<div class="panel"><div class="empty">Nothing matches these filters</div></div>`;
  if(F.view === "table"){
    list.innerHTML = rows.length ? table(rows, now) : none;
  } else if(F.group){
    const byRepo = {};
    rows.forEach(pr=>(byRepo[pr.repo] ||= []).push(pr));
    list.innerHTML = Object.entries(byRepo).map(([r,ps])=>`<div class="group">${esc(r)} · ${ps.length}</div>` + ps.map(p=>card(p,now)).join("")).join("") || none;
  } else {
    list.innerHTML = rows.length ? rows.map(p=>card(p,now)).join("") : none;
  }
  list.querySelectorAll("[data-sub]").forEach(b=>b.addEventListener("click",()=>{
    const k = b.dataset.sub; const pr = DATA.find(p=>key(p)===k); const m = getMarks();
    const on = (pr && pr.submitted) || m[k];
    if(on) delete m[k]; else m[k] = true;
    LS.set("pr_submitted_marks", m); toast(on ? "Unmarked" : "Marked as submitted"); render();
  }));
  list.querySelectorAll("[data-tog]").forEach(b=>b.addEventListener("click",()=>{
    const k = b.dataset.tog; F.collapsed[k] = !(F.collapsed[k] ?? allCollapsed); save(); render();
  }));
  renderSide(now);
  syncControls();
  $("scope").innerHTML = CFG.org ? `<span><b>${esc(CFG.org)}</b></span><span>by <b>${esc(CFG.author)}</b></span><span>opened in the last <b>${CFG.window_hours}h</b></span>` : "";
  if(SNAP){
    const secAgo = Math.max(0, (now - new Date(SNAP).getTime())/1000);
    const live = $("live"); live.classList.toggle("stale", secAgo > 180 && secAgo <= 600); live.classList.toggle("dead", secAgo > 600);
    $("liveText").textContent = `Updated ${fmtDur(secAgo)} ago`;
    $("foot").textContent = `Snapshot ${new Date(SNAP).toLocaleString()} · known PRs refreshed every ~20s, new PRs discovered every ~2min, by a local job on your Mac`;
  }
  $("ring").style.setProperty("--p", Math.min(100,((now-lastFetch)/REFRESH_MS)*100)+"%");
}
function tick(){
  const now = Date.now();
  if(F.view==="table"){ render(); return; }
  document.querySelectorAll(".chk.running").forEach(el=>{
    const k = el.closest(".card")?.dataset.k; const pr = DATA.find(p=>key(p)===k); if(!pr) return;
    const c = (pr.checks||[]).find(c=>c.name===el.querySelector(".nm").textContent && c.state==="running"); if(!c||!c.started_at) return;
    const t = el.querySelector(".t"); if(t) t.textContent = fmtDur((now-new Date(c.started_at).getTime())/1000);
  });
  document.querySelectorAll("#att a[data-start]").forEach(el=>{ el.querySelector(".v").textContent = fmtDur((now-new Date(el.dataset.start).getTime())/1000); });
  if(SNAP){ const secAgo = Math.max(0,(now-new Date(SNAP).getTime())/1000); $("liveText").textContent = `Updated ${fmtDur(secAgo)} ago`; }
  $("ring").style.setProperty("--p", Math.min(100,((now-lastFetch)/REFRESH_MS)*100)+"%");
  $("voiceDot").classList.toggle("speaking", VOICE && 'speechSynthesis' in window && speechSynthesis.speaking);
}

/* ================= controls ================= */
function save(){ LS.set("prmon_filters", F); }
function syncControls(){
  $("q").value = F.q;
  $("segStatus").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===F.status));
  $("segSub").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===F.sub));
  $("segView").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===F.view));
  $("sort").value = F.sort;
  const rs = $("repoSel");
  const repos = [...new Set(DATA.map(p=>p.repo))].sort();
  if(rs.options.length !== repos.length+1){ rs.innerHTML = `<option value="">All repos</option>` + repos.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join(""); }
  rs.value = F.repo;
  $("btnGroup").classList.toggle("on", F.group);
  $("btnTheme").innerHTML = (THEME==="dark" ? "Light" : "Dark") + " <kbd>T</kbd>";
  $("btnExpand").innerHTML = (allCollapsed ? "Expand all" : "Collapse all") + " <kbd>E</kbd>";
  const bv = $("btnVoice");
  bv.classList.toggle("voice-on", VOICE);
  bv.title = VOICE ? "Voice announcements on — click to mute" : "Read check status changes out loud as they happen";
  $("voiceLabel").textContent = VOICE ? "Announcements: On" : "Announcements";
  const ba = $("btnAlarm");
  ba.classList.toggle("alarm-on", ALARM);
  ba.title = ALARM ? "Sound alerts on — click to silence" : "Tick as checks progress, chime when one passes, alarm when one fails";
  $("alarmLabel").textContent = ALARM ? "Sound alerts: On" : "Sound alerts";
}
$("q").addEventListener("input", e=>{ F.q = e.target.value; save(); render(); });
$("segStatus").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; F.status=b.dataset.v; save(); render(); });
$("segSub").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; F.sub=b.dataset.v; save(); render(); });
$("segView").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; F.view=b.dataset.v; save(); render(); });
$("sort").addEventListener("change", e=>{ F.sort=e.target.value; save(); render(); });
$("repoSel").addEventListener("change", e=>{ F.repo=e.target.value; save(); render(); });
$("btnGroup").addEventListener("click", ()=>{ F.group=!F.group; save(); render(); });
$("btnExpand").addEventListener("click", ()=>{ allCollapsed=!allCollapsed; F.collapsed={}; save(); render(); });
$("btnReset").addEventListener("click", ()=>{ Object.assign(F,{q:"",status:"all",sub:"all",sort:"created_desc",repo:"",group:false,collapsed:{}}); allCollapsed=false; save(); render(); toast("Filters reset"); });
$("btnTheme").addEventListener("click", ()=>{ THEME = THEME==="dark"?"light":"dark"; applyTheme(); render(); });
$("btnVoice").addEventListener("click", ()=>{ setVoice(!VOICE); });
$("btnAlarm").addEventListener("click", ()=>{ setAlarm(!ALARM); });
$("btnCopy").addEventListener("click", ()=>{
  const rows = visible();
  const md = ["| PR | Repo | Status | Checks | Failing | Running | Submitted |","|---|---|---|---|---|---|---|",
    ...rows.map(p=>`| [#${p.num}](${p.url}) | ${p.repo} | ${p.overall} | ${p.passed}/${p.total} | ${(p.failed||[]).join(", ")||"—"} | ${(p.running||[]).map(r=>r.name).join(", ")||"—"} | ${isSub(p)?"yes":"no"} |`)].join("\n");
  navigator.clipboard?.writeText(md).then(()=>toast(`Copied ${rows.length} rows as markdown`)).catch(()=>toast("Clipboard blocked"));
});
document.addEventListener("keydown", e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.target.tagName==="INPUT" || e.target.tagName==="SELECT"){ if(e.key==="Escape"){ e.target.blur(); } return; }
  const k = e.key.toLowerCase();
  if(k==="/"){ e.preventDefault(); $("q").focus(); }
  else if(k==="1"){ F.status="all"; save(); render(); }
  else if(k==="2"){ F.status="failing"; save(); render(); }
  else if(k==="3"){ F.status="running"; save(); render(); }
  else if(k==="4"){ F.status="passed"; save(); render(); }
  else if(k==="t"){ $("btnTheme").click(); }
  else if(k==="v"){ F.view = F.view==="table"?"cards":"table"; save(); render(); }
  else if(k==="e"){ $("btnExpand").click(); }
  else if(k==="g"){ $("btnGroup").click(); }
  else if(k==="a"){ $("btnVoice").click(); }
  else if(k==="l"){ $("btnAlarm").click(); }
  else if(k==="r"){ loadData(); toast("Refreshing"); }
});
function applyTheme(){ document.documentElement.setAttribute("data-theme", THEME); LS.set("prmon_theme2", THEME); }

/* ================= data ================= */
// Primary: a tiny Vercel edge function that proxies GitHub's Contents API
// with its own ~75s server-side cache — no GitHub CDN involved, so this is
// the freshest source (worst case ~75s stale, not ~5min).
// Fallback 1: raw.githubusercontent.com (Fastly CDN, ~5min worst case, but
// still typically fresher than the Pages build).
// Fallback 2: the same-origin GitHub Pages copy.
// Each tier is tried in order; a name resolves to /data.json or /events.json.
const SOURCES = {
  "data.json": [
    "https://prmon-live-data-khanagos-projects.vercel.app/api/data",
    "https://raw.githubusercontent.com/rajdeepraoextras-dev/pr-check-monitor/main/docs/data.json",
    "data.json",
  ],
  "events.json": [
    "https://prmon-live-data-khanagos-projects.vercel.app/api/events",
    "https://raw.githubusercontent.com/rajdeepraoextras-dev/pr-check-monitor/main/docs/events.json",
    "events.json",
  ],
};
async function fetchJSON(name){
  let lastErr;
  for(const base of SOURCES[name]){
    try {
      const sep = base.includes("?") ? "&" : "?";
      const r = await fetch(base+sep+"_="+Date.now(), {cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      return await r.json();
    } catch(e) { lastErr = e; }
  }
  throw lastErr;
}
async function loadData(){
  try {
    const [d, ev] = await Promise.all([
      fetchJSON("data.json"),
      fetchJSON("events.json").catch(()=>[]),
    ]);
    prevOverall = Object.fromEntries(DATA.map(p=>[key(p), p.overall]));
    DATA = d.prs || []; SNAP = d.snapshot_time; CFG = d.config || {}; EVENTS = Array.isArray(ev)?ev:[];
    lastFetch = Date.now();
    const changed = DATA.filter(p=>prevOverall[key(p)] && prevOverall[key(p)]!==p.overall);
    if(changed.length) toast(`${changed.length} PR${changed.length>1?"s":""} changed status`);
    announceNewEvents();
    checkAlarm();
    const nf = DATA.filter(p=>p.overall==="failing").length;
    document.title = `${nf?"("+nf+") ":""}PR Check Monitor`;
  } catch(e) {
    $("liveText").textContent = "Failed to load data";
    $("live").classList.add("dead");
  }
  render();
}
applyTheme();
loadData();
setInterval(loadData, REFRESH_MS);
setInterval(tick, 1000);
</script>
</body>
